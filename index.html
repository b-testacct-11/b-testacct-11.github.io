<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Webite</title>
    <style>
      :root { --ink: #18201b; --muted: #6b7280; --bg: #ffffff; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      nav { display: none; }
      main {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .fullscreen-img {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
        object-position: center;
        display: block;
      }
    </style>
  </head>
  <body>
    <nav><span></span></nav>
    <main>
      <img alt="Full screen image" class="fullscreen-img" style="width: 100vw; height: 100vh; height: 100dvh; object-fit: cover; object-position: center; display: block;" src="assets/uploads/upload-1790392336337-226348171.jpg">
    </main>
  

</body></html>
